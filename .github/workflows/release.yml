name: Release

# Tagging builds the artefacts and attaches them to a GitHub release:
#
#   git tag -a v0.1.0 -m "Ducky Can Shoot 0.1.0"
#   git push origin v0.1.0
#
# The wheel is checked before it is published: it is installed into a clean
# environment and asked for its version and its QML directory, because a wheel
# that cannot find its interface is worse than no wheel at all.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the pushed tag)"
        required: false

permissions:
  contents: write
  # the build provenance attestation: the workflow has to be able to ask GitHub
  # to sign a statement about the artefacts it produced
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the wheel contents
        run: |
          python -m pip install dist/*.whl
          python -m dcs version
          # The interface has to travel inside the wheel.  It is checked on the
          # filesystem instead of imported: this job installs no PyQt6, because a
          # wheel that cannot be installed without Qt is exactly what the command
          # line user wants.
          python - <<'EOF'
          import os
          import dcs

          qml = os.path.join(os.path.dirname(dcs.__file__), "gui", "qml")
          assert os.path.isfile(os.path.join(qml, "Main.qml")), qml
          print("QML interface shipped:", qml)
          EOF
          python -c "import dcs.core.config as c, tomllib; print('default config keys:', len(tomllib.loads(c.dumps_toml(c.AppConfig().to_dict()))))"

      - name: Build the Debian package
        run: |
          # dpkg-deb is part of dpkg and therefore already on the runner; the
          # script takes the wheel that was just built and lays the package out
          # the way a Debian system expects it.
          ./scripts/build-deb.sh
          dpkg-deb --info dist/*.deb | sed -n '1,12p'
          echo "files in the package: $(dpkg-deb --contents dist/*.deb | wc -l)"

      - name: Check that the package installs the interface
        run: |
          # extract it and run it from the extracted tree: no root needed, and it
          # proves the wheel inside the package can find its QML
          ROOT="$(mktemp -d)"
          dpkg-deb --extract dist/*.deb "$ROOT"
          PYTHONPATH="$ROOT/usr/lib/python3/dist-packages" python -m dcs version
          PYTHONPATH="$ROOT/usr/lib/python3/dist-packages" python - <<'EOF'
          import os
          import dcs

          qml = os.path.join(os.path.dirname(dcs.__file__), "gui", "qml")
          assert os.path.isfile(os.path.join(qml, "Main.qml")), qml
          print("QML interface inside the package:", qml)
          EOF

      - name: Store the artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  appimage:
    # The image bundles Python, Qt, Kirigami and ClamAV, so it is built on the
    # distribution those come from: before 26.04 there is no Kirigami 6 for Qt 6.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install what the image will bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pyqt6 python3-pyqt6.qtqml python3-pyqt6.qtquick \
            python3-requests qml6-module-org-kde-kirigami qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            qt6-svg-plugins libqt6svg6 clamav curl ca-certificates tar binutils file

      - name: Build the AppImage
        run: ./scripts/build-appimage.sh

      - name: Run it on a machine that has nothing installed
        run: |
          # The point of the image is that it needs none of the packages above,
          # so it is run in a bare container: no Python, no Qt, no ClamAV.
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:26.04 bash -lc '
            set -e
            /dist/DuckyCanShoot-*.AppImage --appimage-extract-and-run --version
            /dist/DuckyCanShoot-*.AppImage --appimage-extract-and-run engines
            mkdir -p /tmp/stick
            printf "X5O!P%%@AP[4\\PZX54(P^)7CC)7}\$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!\$H+H*" > /tmp/stick/eicar.com
            /dist/DuckyCanShoot-*.AppImage --appimage-extract-and-run scan /tmp/stick
          ' 2>&1 | tee appimage-smoke.txt
          grep -q "EICAR" appimage-smoke.txt || { echo "the bundled database did not detect EICAR"; exit 1; }

      - name: Store the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [build, appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: appimage
          path: dist

      # The notes are built by the script, never by appending a shell heredoc: a
      # heredoc runs command substitutions, which turned the code fences of the
      # first two releases into the output of "apt install" and "pip install".
      - name: Write the release notes for this tag
        run: python3 scripts/changelog-for-tag.py "${GITHUB_REF_NAME}" --output release-notes.md

      - name: Write the checksum file
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # A statement, signed by GitHub, that these exact files were produced by
      # this workflow from this commit.  It is what turns "trust the download"
      # into "check the attestation".
      - name: Attest the artefacts
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.whl
            dist/*.tar.gz
            dist/*.AppImage

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Ducky Can Shoot ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist/*
