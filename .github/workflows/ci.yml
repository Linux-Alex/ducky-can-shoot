name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# every job only reads the repository; keeping the default token read-only is
# the workflow-level half of "no step can quietly change the project"
permissions:
  contents: read

jobs:
  # The full suite, including the QML interface, against the distribution's Qt
  # stack.  Packages from apt are used on purpose: the QML modules (Kirigami,
  # QtQuick Controls) have to come from the same Qt build as the interpreter's
  # bindings, and that only holds when both are installed by the distribution.
  test-distro-qt:
    # Ubuntu 24.04, which ubuntu-latest still points at, carries no KF6 at all:
    # Kirigami 6 is not packaged there, so the interface cannot even be imported.
    # 26.04 has Qt 6.10 and Kirigami 6.24, which is what this project targets.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Qt, QML and KDE runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-requests \
            python3-pyqt6 python3-pyqt6.qtqml python3-pyqt6.qtquick \
            qml6-module-org-kde-kirigami qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            libqt6svg6 qt6-svg-plugins zip p7zip-full udisks2 util-linux \
            python3-build python3-venv python3-pip python3-pytest-cov

      - name: Show the environment
        run: |
          python3 -c "import sys, PyQt6; from PyQt6.QtCore import QT_VERSION_STR; print(sys.version, 'PyQt6', QT_VERSION_STR)"

      # Coverage is reported on the run that actually exercises the interface:
      # the headless matrix below would score the QML-facing modules at zero.
      # The floor lives in pyproject.toml so a local run and CI agree.
      - name: Test (offscreen Qt, with coverage)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python3 -m pytest -q --cov --cov-report=term-missing

      - name: Build the Debian package
        run: |
          # the package is built on the release tag, so it is checked on every
          # push as well: dpkg-deb refuses a tree that is not a package
          ./scripts/build-deb.sh
          dpkg-deb --contents dist/*.deb | wc -l

      - name: Smoke test the CLI
        env:
          PYTHONPATH: src
        run: |
          python3 -m dcs version
          python3 -m dcs providers
          python3 -m dcs config show | head -20
          python3 -m dcs doctor --offline || true

  # The headless core on every supported interpreter.  No Qt here: dcs.core must
  # keep working on a machine where PyQt6 cannot be installed.
  test-core-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytest

      - name: Test the core, CLI and reports
        env:
          PYTHONPATH: src
        run: python -m pytest -q --ignore=tests/test_gui.py

  # mypy is configured in pyproject.toml and was, for a while, only aspirational:
  # nothing ran it.  It runs here on the interpreter the project targets, with
  # the core importable through PYTHONPATH so "packages = [\"dcs\"]" resolves.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy requests

      - name: mypy
        env:
          PYTHONPATH: src
        run: mypy

  # The wheel and the sdist are what a user installs; building them and running
  # the installed copy in a clean virtual environment catches the packaging bug
  # that a source checkout never shows (a missing QML file, a data file left
  # out of the wheel, an entry point that only works from ./bin).
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
          ls -l dist

      - name: Install the wheel into a bare virtual environment
        run: |
          python -m venv /tmp/dcs-venv
          /tmp/dcs-venv/bin/pip install --quiet --upgrade pip
          # --no-deps on purpose: PyQt6 is a real dependency of the interface,
          # but the headless commands this job runs must work without it.  A
          # wheel whose metadata accidentally requires Qt at import time would
          # fail here, which is exactly the packaging bug this catches.
          /tmp/dcs-venv/bin/pip install --quiet requests
          /tmp/dcs-venv/bin/pip install --quiet --no-deps dist/*.whl

      - name: The installed copy works and carries its data files
        run: |
          /tmp/dcs-venv/bin/dcs version
          /tmp/dcs-venv/bin/dcs version --json
          /tmp/dcs-venv/bin/dcs providers --json > /dev/null
          /tmp/dcs-venv/bin/dcs config show | head -5
          /tmp/dcs-venv/bin/python - <<'EOF'
          from pathlib import Path

          import dcs

          root = Path(dcs.__file__).resolve().parent
          for relative in ("gui/qml/Main.qml", "gui/qml/views/HistoryView.qml", "data/hashes.txt"):
              path = root / relative
              assert path.is_file(), f"the wheel does not contain {relative}"
          print("the wheel is self contained:", root)
          EOF

      - name: The sdist contains the tests and the documentation
        run: |
          # hatchling puts everything under <name>-<version>/, so match the tail
          tar tzf dist/*.tar.gz | grep -q "tests/test_pipeline.py"
          tar tzf dist/*.tar.gz | grep -q "docs/ROADMAP.md"
          tar tzf dist/*.tar.gz | grep -q "scripts/release.sh"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # no moving major tag here: ruff-action's releases are immutable, so the
      # exact version is the only one that can be resolved.  Ruff itself is
      # pinned for the same reason: an unpinned linter once turned this job red
      # on a file the previous release was happy with.  To move the pin, run the
      # newer version over the tree first: uvx ruff@<version> check .
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.1"
          args: check .
