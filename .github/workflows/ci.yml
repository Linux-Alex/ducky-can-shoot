name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The full suite, including the QML interface, against the distribution's Qt
  # stack.  Packages from apt are used on purpose: the QML modules (Kirigami,
  # QtQuick Controls) have to come from the same Qt build as the interpreter's
  # bindings, and that only holds when both are installed by the distribution.
  test-distro-qt:
    # Ubuntu 24.04, which ubuntu-latest still points at, carries no KF6 at all:
    # Kirigami 6 is not packaged there, so the interface cannot even be imported.
    # 26.04 has Qt 6.10 and Kirigami 6.24, which is what this project targets.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Qt, QML and KDE runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-requests \
            python3-pyqt6 python3-pyqt6.qtqml python3-pyqt6.qtquick \
            qml6-module-org-kde-kirigami qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            libqt6svg6 zip p7zip-full udisks2 util-linux

      - name: Show the environment
        run: |
          python3 -c "import sys, PyQt6; from PyQt6.QtCore import QT_VERSION_STR; print(sys.version, 'PyQt6', QT_VERSION_STR)"

      - name: Test (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python3 -m pytest -q

      - name: Smoke test the CLI
        env:
          PYTHONPATH: src
        run: |
          python3 -m dcs version
          python3 -m dcs providers
          python3 -m dcs config show | head -20
          python3 -m dcs doctor --offline || true

  # The headless core on every supported interpreter.  No Qt here: dcs.core must
  # keep working on a machine where PyQt6 cannot be installed.
  test-core-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytest

      - name: Test the core, CLI and reports
        env:
          PYTHONPATH: src
        run: python -m pytest -q --ignore=tests/test_gui.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          args: check src tests
