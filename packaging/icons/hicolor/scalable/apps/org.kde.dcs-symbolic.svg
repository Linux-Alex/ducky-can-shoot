<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!--
    Ducky Can Shoot - symbolic icon, for panels, menus and any other monochrome
    place.  Breeze convention: every shape takes its colour from the theme
    through currentColor, and the holes (the eyes, the barrel) are cut with
    fill-rule="evenodd" instead of being painted over.
  -->
  <title>Ducky Can Shoot</title>
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text {
        color:#232629;
      }
    </style>
  </defs>

  <g class="ColorScheme-Text" fill="currentColor">
    <!-- head, with the eyes cut out -->
    <path fill-rule="evenodd" d="M 11 1.4
      A 4.6 4.6 0 1 0 11 10.6
      A 4.6 4.6 0 1 0 11 1.4 Z
      M 9 4.2 A 0.9 0.9 0 1 0 9 6 A 0.9 0.9 0 1 0 9 4.2 Z
      M 13 4.2 A 0.9 0.9 0 1 0 13 6 A 0.9 0.9 0 1 0 13 4.2 Z"/>
    <!-- the wide bill of a duck, so the silhouette reads as a beak -->
    <path d="M 6.6 8.9 L 15.4 8.9 C 15.4 11.6 13.4 12.9 11 12.9
             C 8.6 12.9 6.6 11.6 6.6 8.9 Z"/>
    <!-- muzzle facing the viewer: the barrel, with the bore cut out -->
    <path fill-rule="evenodd" d="M 11 14.1
      A 3.6 3.6 0 1 0 11 21.3
      A 3.6 3.6 0 1 0 11 14.1 Z
      M 11 15.8 A 1.9 1.9 0 1 1 11 19.6 A 1.9 1.9 0 1 1 11 15.8 Z"/>
    <!-- wings holding it -->
    <ellipse cx="4.4" cy="17.9" rx="1.5" ry="1.9"/>
    <ellipse cx="17.6" cy="17.9" rx="1.5" ry="1.9"/>
  </g>
</svg>
